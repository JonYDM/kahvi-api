# ─────────────────────────────────────────────────────────────────────────────
# docker-compose para DESARROLLO LOCAL: Kahvi API + PostgreSQL.
# Uso: docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kahvi
      POSTGRES_PASSWORD: kahvi_dev
      POSTGRES_DB: kahvi
    ports:
      - "5432:5432"
    volumes:
      - kahvi_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      # Cadena de conexion a PostgreSQL.
      ConnectionStrings__Chiron: "Host=db;Port=5432;Database=kahvi;Username=kahvi;Password=kahvi_dev"
      ASPNETCORE_URLS: "http://+:8080"
      # JWT — cambiar en produccion
      Jwt__Clave: "clave-de-desarrollo-solo-local-cambiar-en-produccion-1234567890"
    ports:
      - "8080:8080"

volumes:
  kahvi_pgdata:
